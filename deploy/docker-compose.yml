# 生产编排：MySQL 8.0.36（>=8.0.16 才强制 CHECK 约束）+ 应用容器
# 用法：
#   cp deploy/.env.prod.example deploy/.env && vi deploy/.env
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f app

services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yoga}
      MYSQL_USER: ${MYSQL_USER:-yoga}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/.env 配置 MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # 不对公网暴露数据库端口
    expose:
      - "3306"

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内固定用 compose 服务名访问数据库，避免 .env 里误写 localhost
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-yoga}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-yoga}?charset=utf8mb4
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_BIND:-127.0.0.1}:8002:8002"
    volumes:
      # 备份脚本在宿主机执行，挂载同一目录便于落盘
      - ./backups:/app/backups

volumes:
  mysql-data:
