# Nginx 反代（T-19）：HTTPS + HTTP 跳转 + HSTS，API 与管理后台同源
# 启用前：把 your-domain.example 换成真实域名，证书路径按实际修改。
# 证书可用 certbot 签发：certbot certonly --webroot -w /var/www/certbot -d <domain>

upstream yoga_app {
    server 127.0.0.1:8002;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.example;

    # certbot webroot 续期
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 8m;

    # 管理后台（同源静态）
    location /admin/ {
        proxy_pass http://yoga_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location / {
        proxy_pass http://yoga_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    access_log /var/log/nginx/yoga.access.log;
    error_log  /var/log/nginx/yoga.error.log;
}
