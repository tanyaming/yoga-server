<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>场馆连锁客户管理平台 · 管理后台</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>

  <!-- ============ 登录页 ============ -->
  <div id="login-view" class="login-view">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark">序</div>
        <div class="login-brand-txt">
          <h1>场馆连锁客户管理平台</h1>
          <p>素序瑜伽 · 管理后台</p>
        </div>
      </div>
      <form id="login-form" class="login-form">
        <label>账号
          <input id="login-username" type="text" value="admin" autocomplete="username">
        </label>
        <label>密码
          <input id="login-password" type="password" value="admin123" autocomplete="current-password">
        </label>
        <div class="login-err" id="login-err"></div>
        <button type="submit" class="btn btn-primary btn-block">进入后台</button>
      </form>
      <p class="login-hint">演示账号 admin / admin123 · 教练 coach / coach123</p>
    </div>
  </div>

  <!-- ============ 主布局 ============ -->
  <div id="app-view" class="app-view" style="display:none">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">序</div>
        <div>
          <div class="brand-name">素序瑜伽</div>
          <div class="brand-sub">连锁客户管理平台</div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <a href="#/dashboard" data-page="dashboard"><span class="ico">▤</span>经营看板</a>
        <a href="#/members" data-page="members"><span class="ico">◉</span>会员管理</a>
        <a href="#/payments" data-page="payments"><span class="ico">¥</span>收款登记</a>
        <a href="#/products" data-page="products"><span class="ico">▦</span>商品管理</a>
        <a href="#/schedule" data-page="schedule"><span class="ico">▥</span>排课管理</a>
        <a href="#/reconcile" data-page="reconcile"><span class="ico">≋</span>账实核对</a>
      </nav>
      <div class="sidebar-foot">
        <div id="sidebar-user" class="sidebar-user">—</div>
        <button id="logout-btn" class="btn-ghost">退出登录</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title" id="topbar-title">经营看板</div>
        <div class="topbar-right">
          <span class="topbar-chip" id="topbar-role">—</span>
          <span class="topbar-user" id="topbar-user">—</span>
        </div>
      </header>
      <main id="content" class="content"></main>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="assets/app.js"></script>
</body>
</html>
